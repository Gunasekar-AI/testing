name: QA Merge and Deploy

on:
  pull_request:
    types: [closed]
    branches:
      - SCRUM-2-QA

jobs:
  deploy-to-qa:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    # THIS IS THE MAGIC LINE FOR JIRA DEPLOYMENTS:
    environment: 
      name: QA
      url: https://your-qa-server-url.com 
    
    steps:
      - name: Simulate Deployment
        run: |
          echo "Deploying code to QA server..."
          # If you had actual deployment scripts (like AWS, Azure, or Ansible), they would go here.
          sleep 5 
          echo "✅ Deployment Successful!"

